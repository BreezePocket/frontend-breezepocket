<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 768" font-family="Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="md-coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#075ace"/><stop offset="1" stop-color="#13eafb"/></linearGradient>
  </defs>
  <rect width="1344" height="768" fill="#eaf3f9"/>
  <text x="64" y="86" fill="#0b2350" letter-spacing="-1" style="font-size:40px;font-weight:500">The same coins, two ways to wait</text>
  <text x="64" y="128" fill="#4a6a8f" style="font-size:21px">Most holders are already waiting for a price. Only one of these ways pays for it.</text>

  <!-- Left: waiting on your own -->
  <rect x="64" y="168" width="592" height="356" rx="24" fill="#fcfcfc"/>
  <text x="104" y="222" fill="#0b2350" style="font-size:24px;font-weight:500">Waiting on your own</text>
  <!-- idle coin + clock -->
  <ellipse cx="160" cy="330" rx="46" ry="16" fill="#c9d6e3"/>
  <rect x="114" y="286" width="92" height="44" fill="#d9e3ec"/>
  <ellipse cx="160" cy="286" rx="46" ry="16" fill="#e8eff5" stroke="#c9d6e3" stroke-width="2"/>
  <circle cx="218" cy="270" r="26" fill="#fcfcfc" stroke="#c9d6e3" stroke-width="3"/>
  <line x1="218" y1="270" x2="218" y2="254" stroke="#8ea3ba" stroke-width="3" stroke-linecap="round"/>
  <line x1="218" y1="270" x2="230" y2="278" stroke="#8ea3ba" stroke-width="3" stroke-linecap="round"/>
  <g fill="#4a6a8f" style="font-size:19px">
    <circle cx="292" cy="272" r="5" fill="#c9d6e3"/><text x="310" y="278">Your SOL sits in the wallet</text>
    <circle cx="292" cy="324" r="5" fill="#c9d6e3"/><text x="310" y="330">Income while you wait: none</text>
    <circle cx="292" cy="376" r="5" fill="#c9d6e3"/><text x="310" y="382">You watch the chart and hope</text>
  </g>
  <rect x="104" y="440" width="228" height="40" rx="20" fill="#f1f4f7"/>
  <text x="218" y="466" fill="#7a92ad" text-anchor="middle" style="font-size:17px;font-weight:500">Waiting costs you time</text>

  <!-- Right: waiting with BreezePocket -->
  <rect x="688" y="168" width="592" height="356" rx="24" fill="#fcfcfc" stroke="#1877f6" stroke-width="3"/>
  <text x="728" y="222" fill="#0b2350" style="font-size:24px;font-weight:500">Waiting with BreezePocket</text>
  <!-- earning coin -->
  <ellipse cx="784" cy="330" rx="46" ry="16" fill="#0f5fd0"/>
  <rect x="738" y="286" width="92" height="44" fill="url(#md-coin)"/>
  <ellipse cx="784" cy="286" rx="46" ry="16" fill="#8fd8ff" stroke="#1877f6" stroke-width="2"/>
  <g stroke="#13eafb" stroke-width="4" stroke-linecap="round">
    <line x1="846" y1="262" x2="846" y2="246"/><line x1="862" y1="276" x2="874" y2="264"/><line x1="828" y1="250" x2="818" y2="238"/>
  </g>
  <text x="784" y="380" text-anchor="middle" fill="#1877f6" style="font-size:15px;font-weight:700">+ income</text>
  <g fill="#0b2350" style="font-size:19px">
    <circle cx="916" cy="272" r="5" fill="#1877f6"/><text x="934" y="278">Your SOL stays yours, non-custodial</text>
    <circle cx="916" cy="324" r="5" fill="#1877f6"/><text x="934" y="330">Income paid upfront while you wait</text>
    <circle cx="916" cy="376" r="5" fill="#1877f6"/><text x="934" y="382">Filled at your price, or keep your coins</text>
  </g>
  <rect x="728" y="440" width="228" height="40" rx="20" fill="#e8f1fe"/>
  <text x="842" y="466" fill="#1462cc" text-anchor="middle" style="font-size:17px;font-weight:500">Waiting pays you</text>

  <!-- Flow strip -->
  <text x="64" y="586" fill="#4a6a8f" letter-spacing="1" style="font-size:16px">HOW IT WORKS</text>
  <g fill="#0b2350" style="font-size:18px;font-weight:500">
    <rect x="64" y="606" width="262" height="92" rx="20" fill="#fcfcfc"/><circle cx="98" cy="640" r="14" fill="#1877f6"/><text x="98" y="646" fill="#fff" text-anchor="middle" style="font-size:15px;font-weight:700">1</text><text x="124" y="646">Deposit</text><text x="98" y="678" fill="#4a6a8f" style="font-size:15px;font-weight:400">SOL, BTC, ETH or USDC</text>
    <path d="M336 652 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#8ea3ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="372" y="606" width="262" height="92" rx="20" fill="#fcfcfc"/><circle cx="406" cy="640" r="14" fill="#1877f6"/><text x="406" y="646" fill="#fff" text-anchor="middle" style="font-size:15px;font-weight:700">2</text><text x="432" y="646">Name a price</text><text x="406" y="678" fill="#4a6a8f" style="font-size:15px;font-weight:400">Sell at $250, or buy at $2,500</text>
    <path d="M644 652 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#8ea3ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="680" y="606" width="262" height="92" rx="20" fill="#fcfcfc"/><circle cx="714" cy="640" r="14" fill="#1877f6"/><text x="714" y="646" fill="#fff" text-anchor="middle" style="font-size:15px;font-weight:700">3</text><text x="740" y="646">Get paid upfront</text><text x="714" y="678" fill="#4a6a8f" style="font-size:15px;font-weight:400">Income lands right away</text>
    <path d="M952 652 h20 m-8 -8 l8 8 l-8 8" fill="none" stroke="#8ea3ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="988" y="606" width="292" height="92" rx="20" fill="#fcfcfc"/><circle cx="1022" cy="640" r="14" fill="#1877f6"/><text x="1022" y="646" fill="#fff" text-anchor="middle" style="font-size:15px;font-weight:700">4</text><text x="1048" y="646">Filled, or keep your coins</text><text x="1022" y="678" fill="#4a6a8f" style="font-size:15px;font-weight:400">Either way, the income is yours</text>
  </g>
  <text x="64" y="740" fill="#7a92ad" style="font-size:16px">Illustrative. Prices and income vary with the market; a filled target means you sold or bought at the price you chose.</text>
</svg>
